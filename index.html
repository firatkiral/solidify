<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solidify</title>
    <meta name="description" content="Solidify: model solids from sketches in your browser, and export them for 3D printing as 3MF, STL or STEP." />
    <meta name="theme-color" content="#111115" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
        // Light or dark before anything shows, as Settings › Appearance has it or as the system is (Appearance.ts keeps it
        // up to date once the app starts)
        (function () {
            var theme = 'system';
            try {
                var match = /theme:\s*'(light|dark|system)'/.exec(localStorage.getItem('solidify:settings') || '');
                if (match) theme = match[1];
            } catch (e) { }
            if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#e4e4e7' : '#111115';
        })();
    </script>
    <style>
        /* The loading screen shows before the stylesheet loads, so it repeats the palette's colours from index.css, dark
           and light: background, muted text, title, viewport, the logo's sky and cyan, and danger text */
        html {
            background-color: #111115;
        }

        /* Until the app has started, only the loading screen shows */
        body:not(.started)> :not(#loading) {
            display: none !important;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #a1a1aa;
            text-align: center;
            padding: 0 16px;
        }

        #loading .logo {
            width: 72px;
            height: 72px;
            margin-bottom: 4px;
        }

        #loading .name {
            font-size: 18px;
            font-weight: 600;
            color: #fafafa;
        }

        #loading .bar {
            width: 260px;
            max-width: 80vw;
            height: 4px;
            border-radius: 2px;
            background: #27272a;
            overflow: hidden;
        }

        #loading .fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #04a6fc, #00d7fe);
            transition: width 0.2s;
        }

        #loading.indeterminate .fill {
            width: 30%;
            animation: loading 1.2s ease-in-out infinite;
        }

        #loading.failed .bar {
            display: none;
        }

        #loading.failed .status {
            color: #f86a6a;
            max-width: 440px;
        }

        html[data-theme="light"] {
            background-color: #e4e4e7;
        }

        html[data-theme="light"] #loading {
            color: #52525b;
        }

        html[data-theme="light"] #loading .name {
            color: #18181b;
        }

        html[data-theme="light"] #loading .bar {
            background: #f4f4f5;
        }

        html[data-theme="light"] #loading.failed .status {
            color: #cf1124;
        }

        @keyframes loading {
            from { transform: translateX(-100%) }
            to { transform: translateX(330%) }
        }
    </style>
    <script type="module" src="/src/renderer.ts"></script>
</head>

<body class="flex flex-col h-screen bg-ui-bg">
    <div id="loading" class="indeterminate" role="status" aria-live="polite">
        <img class="logo" src="/logo.svg" alt="" />
        <div class="name">Solidify</div>
        <div class="bar"><div class="fill"></div></div>
        <div class="status">Loading…</div>
        <noscript>Solidify needs JavaScript.</noscript>
    </div>
    <solidify-titlebar></solidify-titlebar>
    <!-- Clips the drawer while it's slid out past the window's right edge, so there's nothing to scroll the page to
         (clip, not hidden, which focus and scrollIntoView could still scroll) -->
    <div id="workspace" class="flex overflow-clip absolute top-0 p-2 w-full h-full">
        <solidify-viewport view="3d">
            <solidify-viewport-header></solidify-viewport-header>
            <solidify-file-menu></solidify-file-menu>
            <solidify-palette></solidify-palette>
            <solidify-mini-bar></solidify-mini-bar>
            <solidify-drawer-tabs></solidify-drawer-tabs>
            <!-- Beside the palette: a command's options, and above them its keyboard shortcuts -->
            <div class="flex absolute left-[58px] bottom-2 flex-col-reverse gap-2 items-start clear-of-drawer pointer-events-none">
                <solidify-dialog></solidify-dialog>
                <solidify-keybindings></solidify-keybindings>
            </div>
            <solidify-snap-overlay></solidify-snap-overlay>
        </solidify-viewport>
        <!-- Over the viewport, but not in it, so the viewport's keyboard shortcuts stay out of its panels -->
        <solidify-drawer>
            <div class="drawer-card surface">
                <solidify-outliner data-tab="scene"></solidify-outliner>
                <solidify-properties-panel data-tab="properties"></solidify-properties-panel>
                <solidify-selection-panel data-tab="selection"></solidify-selection-panel>
                <solidify-view-panel data-tab="view"></solidify-view-panel>
                <solidify-snaps data-tab="snaps"></solidify-snaps>
                <solidify-planes data-tab="planes"></solidify-planes>
                <solidify-stats data-tab="stats"></solidify-stats>
            </div>
        </solidify-drawer>
    </div>
    <solidify-settings></solidify-settings>
    <solidify-home></solidify-home>
    <solidify-update-notice></solidify-update-notice>
</body>

</html>
