<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solidify</title>
    <meta name="description" content="Solidify: model solids from sketches in your browser, and export them for 3D printing as 3MF, STL or STEP." />
    <meta name="theme-color" content="#111115" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
        html {
            background-color: #111115;
        }

        /* Until the app has started, only the loading screen shows */
        body:not(.started)> :not(#loading) {
            display: none !important;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #a1a1aa;
            text-align: center;
            padding: 0 16px;
        }

        #loading .logo {
            width: 72px;
            height: 72px;
            margin-bottom: 4px;
        }

        #loading .name {
            font-size: 18px;
            font-weight: 600;
            color: #fafafa;
        }

        #loading .bar {
            width: 260px;
            max-width: 80vw;
            height: 4px;
            border-radius: 2px;
            background: #27272a;
            overflow: hidden;
        }

        #loading .fill {
            width: 0;
            height: 100%;
            background: #0a8ff9;
            transition: width 0.2s;
        }

        #loading.indeterminate .fill {
            width: 30%;
            animation: loading 1.2s ease-in-out infinite;
        }

        #loading.failed .bar {
            display: none;
        }

        #loading.failed .status {
            color: #fca5a5;
            max-width: 440px;
        }

        @keyframes loading {
            from { transform: translateX(-100%) }
            to { transform: translateX(330%) }
        }
    </style>
    <script type="module" src="/src/renderer.ts"></script>
</head>

<body class="flex flex-col h-screen bg-neutral-900">
    <div id="loading" class="indeterminate" role="status" aria-live="polite">
        <img class="logo" src="/logo.svg" alt="" />
        <div class="name">Solidify</div>
        <div class="bar"><div class="fill"></div></div>
        <div class="status">Loading…</div>
        <noscript>Solidify needs JavaScript.</noscript>
    </div>
    <solidify-titlebar></solidify-titlebar>
    <div id="workspace" class="absolute top-0 h-full w-full py-2 px-2">
        <solidify-pane-axis class="horizontal">

            <solidify-pane class="below-menu py-[42px]">
                <solidify-outliner></solidify-outliner>
            </solidify-pane>

            <solidify-pane-resize-handle></solidify-pane-resize-handle>

            <solidify-pane style="flex-grow: 4">
                <solidify-viewport view="3d">
                    <solidify-viewport-header></solidify-viewport-header>
                    <solidify-palette></solidify-palette>
                    <solidify-toolbar></solidify-toolbar>
                    <solidify-keybindings></solidify-keybindings>
                    <solidify-dialog></solidify-dialog>
                    <solidify-snap-overlay></solidify-snap-overlay>
                </solidify-viewport>
            </solidify-pane>

            <solidify-pane-resize-handle></solidify-pane-resize-handle>

            <solidify-pane-axis class="below-menu vertical py-[42px] w-5 max-w-5" style="flex-grow: 0.5;">

                <solidify-pane>
                    <solidify-snaps></solidify-snaps>
                </solidify-pane>

                <solidify-pane-resize-handle></solidify-pane-resize-handle>

                <solidify-pane>
                    <solidify-planes></solidify-planes>
                </solidify-pane>

                <solidify-pane-resize-handle></solidify-pane-resize-handle>

                <solidify-pane>
                    <solidify-stats></solidify-stats>
                </solidify-pane>

            </solidify-pane-axis>

        </solidify-pane-axis>
    </div>
    <solidify-settings></solidify-settings>
    <solidify-home></solidify-home>
    <solidify-update-notice></solidify-update-notice>
</body>

</html>
